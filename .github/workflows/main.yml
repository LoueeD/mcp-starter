name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Worker secrets (CEREMONY_KEY, ENCRYPTION_KEYS) are configured once with
      # `wrangler secret put` and are preserved by `wrangler deploy`.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify

      - name: Health check
        if: vars.DEPLOY_ORIGIN != ''
        run: |
          set -euo pipefail
          origin="${DEPLOY_ORIGIN:?Set the DEPLOY_ORIGIN repository variable to your Worker origin}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 "$origin/health" >/dev/null; then
              echo "Health check passed."
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed." >&2
          exit 1
        env:
          DEPLOY_ORIGIN: ${{ vars.DEPLOY_ORIGIN }}
