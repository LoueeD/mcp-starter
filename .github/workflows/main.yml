name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A new fork or public clone may not have Cloudflare credentials yet.
      # Skip the deploy with a visible notice instead of failing CI.
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
          fi

      # Worker secrets (CEREMONY_KEY, ENCRYPTION_KEYS) are configured once with
      # `wrangler secret put` and are preserved by `wrangler deploy`.
      - name: Deploy
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify

      - name: Health check
        if: steps.credentials.outputs.configured == 'true' && vars.DEPLOY_ORIGIN != ''
        run: |
          set -euo pipefail
          origin="${DEPLOY_ORIGIN:?Set the DEPLOY_ORIGIN repository variable to your Worker origin}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 "$origin/health" >/dev/null; then
              echo "Health check passed."
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed." >&2
          exit 1
        env:
          DEPLOY_ORIGIN: ${{ vars.DEPLOY_ORIGIN }}
